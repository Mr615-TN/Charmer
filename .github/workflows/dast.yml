name: Daemon DAST & Integration Security

on:
  pull_request:
    branches: [ main ]

jobs:
  daemon-security-test:
    name: Test Charmer Daemon Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Charmer Daemon Container
        run: |
          docker build -t charmerd:test -f Dockerfile.charmerd .
          docker run -d --name charmerd-instance -p 8080:8080 charmerd:test
          sleep 5

      - name: Run Security / DAST Scan against Daemon API
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:8080'
          rules_file_name: '.zap/rules.tsv'

      - name: Cleanup Containers
        if: always()
        run: |
          docker stop charmerd-instance || true
          docker rm charmerd-instance || true
